[router]
hostname = "android-tailnet-router"
# This path exists inside the dedicated router VM, never on the KVM host.
auth_key_file = "/etc/tailnet-android-vm-manager/secrets/tailscale-authkey"
tailscale_interface = "tailscale0"
uplink_interface = "ens3"
guest_interface = "ens4"
lan_address = "10.80.0.1"

[controllers.my-iphone]
# The embedded Scrcpy Remote tsnet node may have more than one address over time.
sources = ["100.64.0.2", "100.64.0.3"]
adb_public_key_file = "/etc/tailnet-android-vm-manager/adb-keys/my-iphone.pub"
active = true

[vms.android-game-01]
labels = ["game", "primary"]
address = "10.80.0.2"
base_image = "/var/lib/tailnet-android-vm-manager/images/android-base.qcow2"
# Omit controllers to allow every active controller. Set an explicit list to
# restrict this VM, for example: controllers = ["my-iphone"]
vcpus = 4
memory_mib = 4096
autostart = false

[network]
router_uplink_network = "default"
guest_network = "tailnet-android-guest"
guest_bridge = "vmbr-android"
guest_subnet = "10.80.0.0/24"

[storage]
state_dir = "/var/lib/tailnet-android-vm-manager"
image_dir = "/var/lib/tailnet-android-vm-manager/images"
vm_dir = "/var/lib/tailnet-android-vm-manager/vms"
